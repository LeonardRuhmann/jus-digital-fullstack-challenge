services:
  postgres:
    image: postgres:16-alpine
    container_name: jusdigital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jusdigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jusdigital_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-jusdigital_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jusdigital} -d ${POSTGRES_DB:-jusdigital_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
